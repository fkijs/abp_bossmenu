<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container-custom" style="display: none;">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <h1 class="navbar-brand"><i class="fas fa-crown"></i> <span data-i18n="title"></span></h1>
            <div class="navbar-nav">
                <a class="nav-item nav-link active" data-toggle="pill" href="#home" onclick="openTab('home')"><i class="fas fa-home"></i> <span data-i18n="nav_home"></span></a>
                <a class="nav-item nav-link" data-toggle="pill" href="#recruit" onclick="openTab('recruit')"><i class="fas fa-user-plus"></i> <span data-i18n="nav_recruit"></span></a>
                <a class="nav-item nav-link" data-toggle="pill" href="#society" onclick="openTab('society')"><i class="fas fa-building"></i> <span data-i18n="nav_society"></span></a>
                <a class="nav-item nav-link" data-toggle="pill" href="#attendance" onclick="openTab('attendance')"><i class="fas fa-calendar-check"></i> <span data-i18n="nav_attendance"></span></a>
                <a class="nav-item nav-link" data-toggle="pill" href="#permissions" onclick="openTab('permissions')"><i class="fas fa-key"></i> <span data-i18n="nav_permissions"></span></a>
                <a class="nav-item nav-link" data-toggle="pill" href="#transactions" onclick="openTab('transactions')"><i class="fas fa-chart-bar"></i> <span data-i18n="nav_transactions"></span></a>
            </div>
        </nav>
        <div class="tab-content">
            <div id="home" class="tab-pane fade show active">
                <h2 data-i18n="dashboard_title"></h2>
                <div class="row">
                    <div class="col-sm-6 col-md-3 mb-3">
                        <div class="card text-center bg-dark text-white h-100">
                            <div class="card-body">
                                <h5 class="card-title" data-i18n="total_employees_title"></h5>
                                <p class="card-text" id="totalEmployees" data-i18n="loading"></p>
                                <span data-i18n="total_employees_desc"></span>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-3 mb-3">
                        <div class="card text-center bg-dark text-white h-100">
                            <div class="card-body">
                                <h5 class="card-title" data-i18n="society_money_title"></h5>
                                <p class="card-text" id="societyMoney" data-i18n="loading"></p>
                                <span data-i18n="society_money_desc"></span>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-3 mb-3">
                        <div class="card text-center bg-dark text-white h-100">
                            <div class="card-body">
                                <h5 class="card-title" data-i18n="online_now_title"></h5>
                                <p class="card-text" id="onlineNow" data-i18n="loading"></p>
                                <span data-i18n="online_now_desc"></span>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-3 mb-3">
                        <div class="card text-center bg-dark text-white h-100">
                            <div class="card-body">
                                <h5 class="card-title" data-i18n="your_rank_title"></h5>
                                <p class="card-text" id="yourRank" data-i18n="loading"></p>
                                <span data-i18n="your_rank_desc"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="charts">
                    <canvas id="employeeChart"></canvas>
                </div>
                <div class="employees mt-3">
                    <h3><i class="fas fa-users"></i> <span data-i18n="employees_title"></span></h3>
                    <ul id="employeeList" class="list-group"></ul>
                </div>
            </div>
            <div id="recruit" class="tab-pane fade">
                <h2 data-i18n="recruit_title"></h2>
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text input-group-text-custom"><i class="fas fa-id-badge"></i></span>
                    </div>
                    <input type="text" id="recruitID" class="form-control form-control-custom" placeholder="" data-i18n-placeholder="recruit_placeholder">
                </div>
                <button id="hirePlayer" class="btn btn-custom"><i class="fas fa-user-plus"></i> <span data-i18n="hire_button"></span></button>
            </div>
            <div id="society" class="tab-pane fade">
                <h2 data-i18n="society_title"></h2>
                <p id="societyMoneyDisplay" data-i18n="loading"></p>
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text input-group-text-custom"><i class="fas fa-dollar-sign"></i></span>
                    </div>
                    <input type="number" id="depositAmount" class="form-control form-control-custom" placeholder="" data-i18n-placeholder="deposit_placeholder">
                </div>
                <button id="depositButton" class="btn btn-custom"><i class="fas fa-arrow-circle-down"></i> <span data-i18n="deposit_button"></span></button>
                <div class="input-group mt-3 mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text input-group-text-custom"><i class="fas fa-dollar-sign"></i></span>
                    </div>
                    <input type="number" id="withdrawAmount" class="form-control form-control-custom" placeholder="" data-i18n-placeholder="withdraw_placeholder">
                </div>
                <button id="withdrawButton" class="btn btn-custom"><i class="fas fa-arrow-circle-up"></i> <span data-i18n="withdraw_button"></span></button>
            </div>
            <div id="attendance" class="tab-pane fade">
                <h2 data-i18n="attendance_title"></h2>
                <div class="d-flex justify-content-center mb-3">
                    <button id="markAttendanceIn" class="btn btn-custom mr-3"><i class="fas fa-sign-in-alt"></i> <span data-i18n="attendance_in_button"></span></button>
                    <button id="markAttendanceOut" class="btn btn-custom"><i class="fas fa-sign-out-alt"></i> <span data-i18n="attendance_out_button"></span></button>
                </div>
                <div id="employee-info" class="card text-center bg-dark text-white mb-3">
                    <div class="card-body">
                        <h5 class="card-title" data-i18n="top_employee_title"></h5>
                        <p id="employee-name" class="card-text" data-i18n="top_employee_name"></p>
                        <p id="employee-time" class="card-text" data-i18n="top_employee_time"></p>
                    </div>
                </div>
                <div id="topWorkers" class="card bg-dark text-white">
                    <div class="card-body">
                        <h5 class="card-title" data-i18n="top_workers_title"></h5>
                        <ul id="workerList" class="list-group"></ul>
                    </div>
                </div>
            </div>
            <div id="permissions" class="tab-pane fade">
                <h2 data-i18n="permissions_title"></h2>
                <div class="card bg-dark text-white mb-3">
                    <div class="card-body">
                        <h5 class="card-title" data-i18n="permissions_employee_list_title"></h5>
                        <ul id="permissionsEmployeeList" class="list-group"></ul>
                    </div>
                </div>
                <div class="card bg-dark text-white">
                    <div class="card-body">
                        <h5 class="card-title" data-i18n="permissions_manage_title"></h5>
                        <ul id="permissionsList" class="list-group"></ul>
                    </div>
                </div>
            </div>
            <div id="transactions" class="tab-pane fade">
                <h2 data-i18n="transactions_title"></h2>
                <div class="chart-container">
                    <canvas id="transactionsChart"></canvas>
                </div>
            </div>
        </div>
        <div id="bonusModal" class="modal fade">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content modal-content-custom">
                    <div class="modal-header">
                        <h5 class="modal-title" data-i18n="bonus_modal_title"></h5>
                        <button type="button" class="close" data-dismiss="modal">×</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="bonusCitizenId" data-i18n="bonus_citizen_id_label"></label>
                            <input type="text" id="bonusCitizenId" class="form-control form-control-custom" readonly>
                        </div>
                        <div class="form-group">
                            <label for="bonusModalAmount" data-i18n="bonus_amount_label"></label>
                            <input type="number" id="bonusModalAmount" class="form-control form-control-custom">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button id="confirmGiveBonusButton" class="btn btn-custom action-bonus" data-i18n="bonus_button"></button>
                    </div>
                </div>
            </div>
        </div>
        <button id="closeMenu" class="btn btn-custom mt-3" data-i18n="close_button"></button>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>   
    <script src="js/translations.js"></script> <!-- Nuevo script para manejar traducciones -->
    <script src="js/tabManagement.js"></script>
    <script src="js/apiRequests.js"></script>
    <script src="js/eventListeners.js"></script>    
</body>
</html>
